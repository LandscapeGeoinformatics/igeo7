<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hexagon shape — lighter fill for dark backgrounds -->
  <polygon
    points="50,8 88,29 88,71 50,92 12,71 12,29"
    fill="#43a047"
    stroke="#66bb6a"
    stroke-width="2"
  />
  <!-- Inner hexagon outline -->
  <polygon
    points="50,20 78,35 78,65 50,80 22,65 22,35"
    fill="none"
    stroke="#c8e6c9"
    stroke-width="1.5"
    opacity="0.6"
  />
  <!-- Letter i7 -->
  <text
    x="50"
    y="60"
    text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="32"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-1"
  >i7</text>
</svg>
